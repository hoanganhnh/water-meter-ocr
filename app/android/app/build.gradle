apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }

    namespace "com.watermeterocr"
    defaultConfig {
        applicationId "com.watermeterocr"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    sourceSets { androidTest.assets.srcDirs += [rootProject.file("../../.cache/android-gates-assets")] }
    packaging {
        jniLibs {
            // Compact sideload APKs; Android extracts these libraries at install time.
            // Keep the default direct-loading layout for normal builds/App Bundles.
            useLegacyPackaging = providers.gradleProperty("compressNativeLibs").orElse("false").get().toBoolean()
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // Standalone Interpreter runtime: works offline and does not depend on Play Services.
    implementation("com.microsoft.onnxruntime:onnxruntime-android:1.20.0")
    implementation("org.opencv:opencv:4.12.0")
    implementation("androidx.exifinterface:exifinterface:1.4.2")
    implementation("androidx.camera:camera-camera2:1.5.3")
    implementation("androidx.camera:camera-lifecycle:1.5.3")
    implementation("androidx.camera:camera-view:1.5.3")
    // uCrop's Activity transition is referenced at runtime but is not pulled transitively.
    implementation("androidx.transition:transition:1.7.2")
    testImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.test:core:1.6.1")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

def sha256Hex = { File target ->
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    target.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        int read
        while ((read = stream.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format("%02x", it) }.join("")
}

tasks.register("verifySuppliedYoloAssets") {
    group = "verification"
    description = "Verifies bundled supplied-yolo-3stage-v1 ONNX models and manifest checksums before Android build."
    def ocrAssetsDir = file("src/main/assets/ocr")
    def manifestFile = new File(ocrAssetsDir, "supplied-yolo-manifest.json")
    inputs.file(manifestFile)
    doLast {
        if (!manifestFile.exists()) {
            throw new GradleException("Missing OCR manifest: ${manifestFile}. Run tools.ocr.export_supplied_yolo --stage-android-assets first.")
        }
        def manifest = new groovy.json.JsonSlurper().parseText(manifestFile.getText("UTF-8"))
        if (manifest.pipelineId != "supplied-yolo-3stage-v1" || manifest.contractStatus != "approved") {
            throw new GradleException("Invalid OCR manifest pipelineId=${manifest.pipelineId} contractStatus=${manifest.contractStatus}")
        }
        ["frame", "reverse", "digits"].each { role ->
            def spec = manifest.models[role]
            if (spec == null) {
                throw new GradleException("Missing model spec '${role}' in ${manifestFile}")
            }
            def onnxFile = new File(ocrAssetsDir, spec.file as String)
            if (!onnxFile.exists()) {
                throw new GradleException("Missing bundled ONNX model for '${role}': ${onnxFile}")
            }
            long actualSize = onnxFile.length()
            long expectedSize = (spec.sizeBytes as Number).longValue()
            if (actualSize != expectedSize) {
                throw new GradleException("Size mismatch for ${onnxFile.name}: expected ${expectedSize} bytes, got ${actualSize} bytes")
            }
            String actualSha = sha256Hex(onnxFile)
            String expectedSha = spec.sha256 as String
            if (actualSha != expectedSha) {
                throw new GradleException("SHA-256 mismatch for ${onnxFile.name}: expected ${expectedSha}, got ${actualSha}")
            }
        }
        def allowedFiles = ["frame.onnx", "reverse.onnx", "digits.onnx", "supplied-yolo-manifest.json", "THIRD_PARTY_LICENSES.txt"] as Set
        def actualFiles = (ocrAssetsDir.listFiles() ?: [] as File[]).collect { it.name } as Set
        def unexpectedFiles = actualFiles - allowedFiles
        if (!unexpectedFiles.isEmpty()) {
            throw new GradleException("Unexpected legacy or debug files in ${ocrAssetsDir}: ${unexpectedFiles}")
        }
    }
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn("verifySuppliedYoloAssets")
}

tasks.register("verifySuppliedYoloGateAssets") {
    group = "verification"
    description = "Verifies .cache/android-gates-assets contains supplied-yolo-3stage-v1 instrumentation fixtures."
    def gatesManifestFile = rootProject.file("../../.cache/android-gates-assets/gates-manifest.json")
    inputs.file(gatesManifestFile)
    doLast {
        if (!gatesManifestFile.exists()) {
            throw new GradleException("Missing instrumentation gates manifest: ${gatesManifestFile}. Run tools.ocr.supplied_yolo_reference --stage-gate-assets .cache/android-gates-assets first.")
        }
        def gatesManifest = new groovy.json.JsonSlurper().parseText(gatesManifestFile.getText("UTF-8"))
        if (gatesManifest.pipelineId != "supplied-yolo-3stage-v1" || gatesManifest.semanticsVersion != "supplied-yolo-3stage-v1") {
            throw new GradleException("Stale or invalid instrumentation gate assets: pipelineId=${gatesManifest.pipelineId} semanticsVersion=${gatesManifest.semanticsVersion}")
        }
    }
}

tasks.matching { it.name == "preDebugAndroidTestBuild" }.configureEach {
    dependsOn("verifySuppliedYoloGateAssets")
}
